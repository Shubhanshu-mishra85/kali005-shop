<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Seller</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <h2>WebSeller 🚀</h2>
  <button onclick="showCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
</header>

<section class="hero">
  <h1>Buy Premium Websites 💻</h1>
  <p>Landing Pages • Portfolios • E-commerce Templates</p>
</section>

<section class="products">

  <div class="card">
    <h3>Landing Page</h3>
    <p>Modern UI design</p>
    <h4>$49</h4>
    <button onclick="buy('Landing Page')">Buy</button>
  </div>

  <div class="card">
    <h3>Portfolio Website</h3>
    <p>Personal branding site</p>
    <h4>$79</h4>
    <button onclick="buy('Portfolio Website')">Buy</button>
  </div>

  <div class="card">
    <h3>E-commerce Site</h3>
    <p>Online store template</p>
    <h4>$99</h4>
    <button onclick="buy('E-commerce Site')">Buy</button>
  </div>

</section>

<section class="cart-section" id="cart-box">
  <h2>Your Orders</h2>
  <ul id="cart-items"></ul>
</section>

<footer>
  <p>© 2026 WebSeller</p>
</footer>

<script src="script.js"></script>
</body>
</html>
