<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali007 Web Services</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Kali007 🚀</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#services">Services</a>
    <a href="#pricing">Pricing</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Build Your Website Today 💻</h1>
  <p>Premium Websites for Business, Portfolio & E-commerce</p>

  <div class="search-box">
    <input type="text" placeholder="Search your website idea...">
    <button>Search</button>
  </div>
</section>

<!-- SERVICES -->
<section id="services" class="services">

  <div class="service-card">
    <h3>Landing Page</h3>
    <p>Perfect for startups</p>
  </div>

  <div class="service-card">
    <h3>Portfolio</h3>
    <p>Show your skills</p>
  </div>

  <div class="service-card">
    <h3>E-commerce</h3>
    <p>Sell products online</p>
  </div>

</section>

<!-- PRICING -->
<section id="pricing" class="pricing">

  <div class="price-card">
    <h3>Basic</h3>
    <h2>$49</h2>
    <button onclick="buy('Basic Plan')">Buy Now</button>
  </div>

  <div class="price-card premium">
    <h3>Pro</h3>
    <h2>$99</h2>
    <button onclick="buy('Pro Plan')">Buy Now</button>
  </div>

  <div class="price-card">
    <h3>Enterprise</h3>
    <h2>$199</h2>
    <button onclick="buy('Enterprise Plan')">Buy Now</button>
  </div>

</section>

<!-- CTA -->
<section class="cta">
  <h2>Start Your Online Journey 🚀</h2>
  <button>Get Started</button>
</section>

<footer>
  <p>© 2026 Kali007</p>
</footer>

<script src="script.js"></script>
</body>
</html>
